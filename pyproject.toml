[project]
name = "labeltastic"
dynamic = ["version"]
description = "Meshtastic contact-QR nametag kiosk for Niimbot label printers: DM a node over the mesh, get a printed badge with a shared-contact QR."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "src/labeltastic/_vendor/niimprint/LICENSE", "src/labeltastic/assets/OFL.txt"]
authors = [{ name = "Meshtastic" }]
keywords = ["meshtastic", "lora", "mesh", "niimbot", "label", "printer", "qr", "badge"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Printing",
  "Topic :: Communications :: Ham Radio",
]

dependencies = [
  "meshtastic>=2.6",   # SharedContact / the /v/# contact URL landed in 2.6
  "qrcode>=7.4",
  "pillow>=10.0",
  "pypubsub>=4.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10", "pytest>=8"]

[project.scripts]
labeltastic = "labeltastic.cli:main"

[project.urls]
Homepage = "https://github.com/meshtastic/labeltastic"
Repository = "https://github.com/meshtastic/labeltastic"
Issues = "https://github.com/meshtastic/labeltastic/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/labeltastic/_version.py"

[tool.hatch.build.targets.wheel]
# assets/ (Noto Emoji + OFL) and _vendor/ live inside the package dir, so
# hatchling ships them with the wheel automatically.
packages = ["src/labeltastic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored third-party code is not ours to restyle — see src/labeltastic/_vendor/README.md.
extend-exclude = ["src/labeltastic/_vendor", "src/labeltastic/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # the layout code is column-aligned geometry; wrapping it reads worse
  "SIM105",  # contextlib.suppress hides the comment explaining what is swallowed
  "RUF001",  # ambiguous unicode (— …) is intentional in console text and prose
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
files = ["src/labeltastic"]
ignore_missing_imports = true   # meshtastic / qrcode / pubsub ship no stubs
check_untyped_defs = false
exclude = [
  "_version.py",
  "src/labeltastic/_vendor/",
]

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv build
      - name: Smoke the built wheel
        # `uv build` builds the wheel FROM the sdist, so anything missing there
        # is missing here — silently. The emoji font is the one that matters:
        # without it labeltastic still runs and still prints, it just strips
        # every emoji off the badge. Assert it loads rather than that it exists.
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/python -c "
          import labeltastic, labeltastic.fonts as f
          assert f.HAS_EMOJI, 'emoji font missing from the wheel'
          print('smoke: labeltastic', labeltastic.__version__)
          "
          /tmp/smoke/bin/labeltastic --sample --dry-run --out /tmp/smoke.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    # Only publish from a version tag — a manual workflow_dispatch run stops at
    # the build artifact instead of pushing a dev version to PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/*
          generate_release_notes: true

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the tag
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Smoke the built wheel
        # `uv build` builds the wheel FROM the sdist, so anything missing there
        # is missing here — silently. The emoji font is the one that matters:
        # without it labeltastic still runs and still prints, it just strips
        # every emoji off the badge. Assert it loads rather than that it exists.
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/python -c "
          import labeltastic, labeltastic.fonts as f
          assert f.HAS_EMOJI, 'emoji font missing from the wheel'
          print('smoke: labeltastic', labeltastic.__version__)
          "
          /tmp/smoke/bin/labeltastic --sample --dry-run --out /tmp/smoke.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    # Only publish from a version tag — a manual workflow_dispatch run stops at
    # the build artifact instead of pushing a dev version to PyPI.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
          generate_release_notes: true
